name: football-game-prod

services:
  mongodb:
    image: mongo:7.0
    container_name: football-mongodb-prod
    restart: always
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-football-game}
    volumes:
      - mongodb_data_prod:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - football-network-prod

  backend:
    container_name: football-backend-prod
    build:
      context: ./frontend/backend
      dockerfile: Dockerfile
      target: production
    restart: always
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/${MONGO_DB:-football-game}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - football-network-prod

  frontend:
    container_name: football-frontend-prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    restart: always
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - football-network-prod

volumes:
  mongodb_data_prod:
    name: football_game_mongodb_data_prod

networks:
  football-network-prod:
    name: football_game_network_prod
    driver: bridge
